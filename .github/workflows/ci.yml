# Basic checks, no secrets, no game data, no GPU. Every command is also runnable locally (CONTRIBUTING.md, "CI").
# This is a fork of an upstream project: formatting is checked only on the lines a change touches.
# The full runtime (SDL, Vulkan, FFmpeg, shader recompiler: 39 submodules) is not built here; it takes far longer than a
# basic check should and needs a GPU for most tests. The relinker-only build (no submodules) is built and tested.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Actions are pinned to a full commit SHA (the comment names the release); Dependabot (github-actions) raises them.
jobs:
  relinker:
    name: relinker-only build and tests (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - run: brew install ninja
      - name: Configure and build
        run: |
          cmake -S . -B build-relinker -G Ninja -DCMAKE_BUILD_TYPE=Release -DANYPS5_RELINKER_ONLY=ON -DBUILD_TESTING=ON
          cmake --build build-relinker --parallel 4
      - name: ctest (minus the tests of the upstream's own GitHub workflows, which this fork does not carry)
        run: ctest --test-dir build-relinker -j4 --output-on-failure -E '^(mingw_host_only_test_targets|pr_overlap_tools|progress_report_inputs|ffmpeg_cache_keys|winlibs_digest|progress_comment_concurrency|eligibility_paths|release_workflow|emsdk_pin|conventions_ci_gate|ctest_no_tests_flag|test_script_registration|build_eligibility|pr_intake_reopen|relinker_test_step|stale_conflicts_workflow|conventions_pr_template)$'

  clang-format:
    name: clang-format (changed lines only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: pip install clang-format==22.1.3
      - name: Commits of the change (pull request) or of the push
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: .github/nps5-ci/range.sh >> "$GITHUB_ENV"
      - name: git clang-format against the base
        run: |
          if [ -z "$BASE" ]; then echo "no base commit (first push, new branch or manual run): nothing to compare, skipped"; exit 0; fi
          out=$(git clang-format --diff --extensions c,cc,cpp,h,hpp,mm "$BASE" "$TIP" -- core demo tools || true)
          case "$out" in *"no modified files"*|*"did not modify any files"*|"") echo "clang-format: ok" ;;
            *) echo "$out"; echo "::error::run: git clang-format $BASE   (formats only the lines you changed)"; exit 1 ;; esac

  privacy:
    name: privacy and identity gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Commits of the change (pull request) or of the push
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: .github/nps5-ci/range.sh >> "$GITHUB_ENV"
      - name: Game data, secrets, personal paths, commit e-mails and added lines (copy of the entry repository's gate, .github/nps5-ci)
        run: .github/nps5-ci/privacy.sh

  workflows:
    name: workflow syntax (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: actionlint 1.7.7 (release tarball, sha256 checked)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
